# ===== Informations Générales =====
spring.application.name=pharmacie

# ===== Connexion MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/db_pharmacie?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Hibernate / JPA =====
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Force Hibernate a utiliser les memes noms que les entites et attributs
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== Vues Thymeleaf (prefixe / suffixe) =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
